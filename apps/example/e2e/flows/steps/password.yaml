# Types ${PASSWORD} into the secure field ${FIELD}, replacing what it held. Kara's field carries its testID on iOS; on
# Android it is the field under its "Password" label.
appId: ${APP_ID}
---
- runFlow:
    when:
      platform: iOS
    commands:
      - tapOn:
          id: ${FIELD}
- runFlow:
    when:
      platform: Android
    commands:
      - tapOn:
          below: Password
- eraseText: 40
- inputText: ${PASSWORD}
- hideKeyboard
